# Linux paketlarini yig'ish (amd64 + arm64). Faqat release.yml'dan chaqiriladi.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: "Ilova versiyasi (masalan 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 — eskiroq glibc, paketlar ko'proq distributivlarda ishlaydi
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev file xdg-utils libfuse2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - run: npm ci

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      - name: Build packages
        run: npx tauri build --bundles deb,appimage

      - name: Collect
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb "out/mail_${VERSION}_linux-${ARCH}.deb"
          cp target/release/bundle/appimage/*.AppImage "out/mail_${VERSION}_linux-${ARCH}.AppImage"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 7
