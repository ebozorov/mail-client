[package]
name = "mail-core"
version = "0.1.0"
edition = "2021"
description = "IMAP/SMTP mantiqi — Tauri'dan mustaqil"

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
mail-parser = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
