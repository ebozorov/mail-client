[package]
name = "mail-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "mail_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
mail-core = { path = "../crates/mail-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
